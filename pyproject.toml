[project]
name = "domain-recon"
version = "0.1.0"
description = "Advanced domain reconnaissance tool with a rich terminal UI (DNS, WHOIS, SSL/TLS, ports, web recon, path probing, enumeration)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["reconnaissance", "osint", "dns", "security", "whois", "scanner"]
dependencies = [
    "dnspython>=2.8.0",
    "python-whois>=0.9.6",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
domain-recon = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
include = ["main.py"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"lib/config.py" = ["E501"]
